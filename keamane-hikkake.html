<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>覚えず受かるケアマネ試験｜ひっかけ対策問題集</title>
<style>
:root{
  --ink:#1c2733; --sub:#5a6775; --base:#f3f6f9; --card:#ffffff; --line:#d8e0e8;
  --main:#2b5b86; --main-d:#1f4467; --ok:#2a7a55; --ok-bg:#e6f4ec;
  --ng:#b3462f; --ng-bg:#fbeae6; --warn:#b9780f; --mark:#fff0a8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--base); color:var(--ink);
  font-family:"Yu Gothic","YuGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  font-size:16px; line-height:1.7; -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:560px; margin:0 auto; padding:16px 16px 48px}
h1{font-size:21px; line-height:1.4; margin:8px 0 4px}
h2{font-size:17px; margin:24px 0 8px}
p{margin:8px 0}
.sub{color:var(--sub); font-size:14px}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:12px}
button{font:inherit; cursor:pointer}
.btn{display:block; width:100%; border:0; border-radius:12px; padding:14px; background:var(--main); color:#fff; font-weight:700; font-size:17px; margin-top:12px}
.btn:active{background:var(--main-d)}
.btn[disabled]{background:#b9c5d1; cursor:default}
.btn.ghost{background:#fff; color:var(--main); border:1px solid var(--main); font-weight:600; font-size:15px; padding:11px}
.link{background:none; border:0; color:var(--sub); text-decoration:underline; font-size:13px; padding:8px 0; margin-top:6px}
:focus-visible{outline:3px solid #f2b84b; outline-offset:2px}
.hidden{display:none}
.notice{background:#fff6e0; border:1px solid #f0d9a0; border-radius:10px; padding:8px 12px; font-size:14px; margin:8px 0}
.notice.good{background:var(--ok-bg); border-color:#b7dcc6}

.top{position:sticky; top:0; background:var(--base); padding:10px 0 8px; z-index:2}
.topline{display:flex; justify-content:space-between; align-items:baseline; font-size:14px; color:var(--sub)}
.bar{height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:6px}
.bar i{display:block; height:100%; background:var(--main); transition:width .25s}
.stem{font-size:17.5px; font-weight:700; line-height:1.65; margin:6px 0 14px}
mark{background:var(--mark); padding:0 2px; border-radius:3px}
.opt{display:flex; gap:10px; width:100%; text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; color:var(--ink); line-height:1.6; font-size:15.5px}
.opt:active{background:#eef3f8}
.opt .no{flex:none; width:22px; height:22px; border-radius:50%; background:#e5eef6; color:var(--main-d); font-size:13px; font-weight:700; text-align:center; line-height:22px; margin-top:2px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok); background:var(--ok-bg)}
.opt.wrong{border-color:var(--ng); background:var(--ng-bg)}
.note{margin:-4px 0 12px 32px; font-size:14px; line-height:1.6}
.note b.t{color:var(--ok)}
.note b.f{color:var(--ng)}
.tagk{display:inline-block; font-size:12px; font-weight:700; color:var(--warn); background:#fff3d6; border-radius:6px; padding:0 8px; margin-left:4px; white-space:nowrap}
.verdict{border-radius:12px; padding:12px 14px; margin:6px 0 14px; font-size:15px}
.verdict.ok{background:var(--ok-bg); border:1px solid #b7dcc6}
.verdict.ng{background:var(--ng-bg); border:1px solid #efc4ba}
.verdict strong{display:block; font-size:17px; margin-bottom:2px}

.tcard{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:10px}
.tcard h3{margin:0 0 2px; font-size:16px; color:var(--main-d)}
.tcard .tip{font-size:14.5px}
.tcard .ex{font-size:13.5px; color:var(--sub); margin-top:4px}
.row{display:flex; justify-content:space-between; font-size:15px; font-weight:700}
.track{position:relative; height:12px; background:#e6ecf2; border-radius:6px; margin:6px 0 12px}
.track i{position:absolute; left:0; top:0; bottom:0; border-radius:6px; background:var(--warn)}
.score{text-align:center; padding:6px 0 2px}
.score b{font-size:48px; color:var(--main); line-height:1.1}
.score span{font-size:18px; color:var(--sub)}
textarea.copybox{position:absolute; left:-9999px}
.footlinks{display:flex; justify-content:space-between; margin-top:10px}
</style>
</head>

  ["利用日数は、要介護認定の有効期間のおおむね半数を超えないことが目安とされる。",1,-1,"正しい記述です。"],
  ["介護者の休息（レスパイト）を目的に利用されることもある。",1,-1,"正しい記述です。"],
  ["特別養護老人ホームなどに併設されていることがある。",1,-1,"正しい記述です。"]]}
];

var app = document.getElementById("app");
var D = null;

/* ---------- util ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function ld(k){ try{ var s=localStorage.getItem(k); return s?JSON.parse(s):null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){} }
function userName(){
  var a=ld("keamane10_drill_v1"); if(a && a.name) return a.name;
  var b=ld("keamane10_day1_v1"); if(b && b.name) return b.name;
  return "";
}
function copyText(txt, cb){
  var done=function(){ if(cb) cb(); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ fb(txt); done(); });
  }else{ fb(txt); done(); }
  function fb(t){
    var ta=document.createElement("textarea"); ta.className="copybox"; ta.value=t;
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
  }
}
function evalQ(q, oi){
  var o=q.o[oi];
  var correct = q.neg ? (o[1]===0) : (o[1]===1);
  return {correct:correct, k: correct ? -1 : (q.neg ? 0 : o[2])};
}
function stemHtml(q, reveal){
  var t=esc(q.s);
  if(reveal) t=t.replace(/(誤っている|正しい|適切な)/, "<mark>$1</mark>");
  return t;
}

/* ---------- state ---------- */
function initD(){ return {falls:[0,0,0,0,0,0,0,0], n:0, right:0, qs:{}, sess:null}; }
function weakTypes(){
  var arr=[]; for(var k=0;k<8;k++){ if(D.falls[k]>0) arr.push(k); }
  arr.sort(function(a,b){ return D.falls[b]-D.falls[a]; });
  return arr;
}
function pickWeak(n){
  var weak=weakTypes(), w={}; weak.slice(0,3).forEach(function(k,i){ w[k]=D.falls[k]; });
  var scored=Q.map(function(q,i){
    var s=0;
    q.o.forEach(function(o){
      if(q.neg){ if(o[1]===0 && w[o[2]]) s+=w[o[2]]; }
      else if(o[1]===0 && w[o[2]]) s+=w[o[2]];
    });
    if(q.neg && w[0]) s+=w[0];
    var h=D.qs[i]; if(h && h.w) s+=2;
    return {i:i, s:s+Math.random()};
  });
  scored.sort(function(a,b){ return b.s-a.s; });
  return shuffle(scored.slice(0,n).map(function(x){return x.i;}));
}
function startSession(mode){
  var ids;
  if(mode==="all") ids=shuffle(Q.map(function(_,i){return i;}));
  else if(mode==="weak") ids=pickWeak(10);
  else if(mode==="r20") ids=shuffle(Q.map(function(_,i){return i;})).slice(0,20);
  else ids=shuffle(Q.map(function(_,i){return i;})).slice(0,10);
  var perm={}; ids.forEach(function(id){ perm[id]=shuffle([0,1,2,3,4]); });
  D.sess={mode:mode, ids:ids, i:0, ans:{}, perm:perm};
  save(); viewQuiz();
}

/* ---------- views ---------- */
function viewHome(){
  var h='<p class="sub" style="margin:0"><a href="index.html" style="color:inherit">← 入口ページ</a></p><h1>覚えず受かるケアマネ試験<br>ひっかけ対策問題集</h1><p class="sub">直前期に、ひっかけのパターンを見抜く練習をします。全'+Q.length+'問・本番と同じ5択です。</p>';
  h+='<div class="card"><p style="margin-top:0"><b>ひっかけには、8つの型があります。</b></p>'+
     '<p class="sub" style="margin-bottom:0">問題に答えると、5つの選択肢すべてについて「なぜ正しいか・なぜ誤りか」と、ひっかけの型が表示されます。あなたが引っかかりやすい型が分かります。</p>'+
     '<button class="btn ghost" id="gd">8つの型を読む（3分）</button></div>';
  h+='<h2>問題に挑戦する</h2>';
  if(D.sess){
    h+='<button class="btn" id="rs">続きから再開（'+(D.sess.i+1)+' / '+D.sess.ids.length+'問目）</button><button class="link" id="ab">この回を破棄する</button>';
  }else{
    h+='<button class="btn" id="m10" style="margin-top:0">ランダム10問（約10分）</button>'+
       '<button class="btn ghost" id="m20">ランダム20問（約20分）</button>'+
       '<button class="btn ghost" id="mw"'+(weakTypes().length?'':' disabled')+'>引っかかりやすい型から10問</button>'+
       '<button class="btn ghost" id="mall">全'+Q.length+'問（約'+Math.round(Q.length*1.1)+'分）</button>';
    if(!weakTypes().length) h+='<p class="sub">「引っかかりやすい型から」は、一度解くと使えます。</p>';
  }
  if(D.n>0){
    h+='<h2>これまでに引っかかった型</h2><div class="card" style="margin-top:0">'+
       '<p class="sub" style="margin-top:0">累計 '+D.n+'問中 '+D.right+'問正解</p>';
    var mx=Math.max.apply(null,D.falls.concat([1]));
    for(var k=0;k<8;k++){
      h+='<div class="row"><span>'+esc(TYPES[k].n)+'</span><span>'+D.falls[k]+'回</span></div>'+
         '<div class="track"><i style="width:'+Math.round(D.falls[k]/mx*100)+'%"></i></div>';
    }
    h+='</div><button class="link" id="rst">記録を消す</button>';
  }
  app.innerHTML=h; window.scrollTo(0,0);
  document.getElementById("gd").onclick=viewGuide;
  var e;
  if((e=document.getElementById("rs"))) e.onclick=viewQuiz;
  if((e=document.getElementById("ab"))) e.onclick=function(){ if(confirm("進行中の回を破棄します。よろしいですか？")){ D.sess=null; save(); viewHome(); } };
  if((e=document.getElementById("m10"))) e.onclick=function(){ startSession("rand"); };
  if((e=document.getElementById("m20"))) e.onclick=function(){ startSession("r20"); };
  if((e=document.getElementById("mw"))) e.onclick=function(){ if(weakTypes().length) startSession("weak"); };
  if((e=document.getElementById("mall"))) e.onclick=function(){ startSession("all"); };
  if((e=document.getElementById("rst"))) e.onclick=function(){ if(confirm("ひっかけ対策の記録をすべて消します。よろしいですか？")){ D=initD(); save(); viewHome(); } };
}

function viewGuide(){
  var h='<h1>ひっかけの8つの型</h1><p class="sub">問題を解く前に、一度ざっと目を通してください。</p>';
  TYPES.forEach(function(t,i){
    h+='<div class="tcard"><h3>'+(i+1)+'. '+esc(t.n)+'</h3><div class="tip">'+esc(t.tip)+'</div><div class="ex">例：'+esc(t.ex)+'</div></div>';
  });
  h+='<button class="btn" id="bk">ホームへ</button>';
  app.innerHTML=h; window.scrollTo(0,0);
  document.getElementById("bk").onclick=viewHome;
}

function viewQuiz(){
  var s=D.sess; if(!s) return viewHome();
  if(s.i>=s.ids.length) return viewResult();
  var id=s.ids[s.i], q=Q[id], ans=s.ans[id], answered=(ans!==undefined);
  var h='<div class="top"><div class="topline"><span>第 '+(s.i+1)+' 問 / '+s.ids.length+'</span><button class="link" id="hm" style="margin:0;padding:0">ホームに戻る</button></div>'+
        '<div class="bar"><i style="width:'+(s.i/s.ids.length*100)+'%"></i></div></div>';
  h+='<div class="stem">'+stemHtml(q, answered)+'</div>';
  if(!answered) h+='<p class="sub" style="margin-top:-6px">設問の最後の言葉を、もう一度確認してから選びましょう。</p>';

  var res = answered ? evalQ(q, ans) : null;
  if(answered){
    h+= res.correct
      ? '<div class="verdict ok"><strong>正解です</strong>設問を正しく読めています。選択肢ごとの解説も確認しましょう。</div>'
      : '<div class="verdict ng"><strong>ひっかかりました</strong>引っかかった型：<span class="tagk">'+esc(TYPES[res.k].n)+'</span></div>';
  }
  s.perm[id].forEach(function(oi, pos){
    var o=q.o[oi], cls="opt";
    var isRight = q.neg ? (o[1]===0) : (o[1]===1);
    if(answered){ if(isRight) cls+=" right"; else if(oi===ans) cls+=" wrong"; }
    h+='<button class="'+cls+'" data-o="'+oi+'"'+(answered?' disabled':'')+'><span class="no">'+(pos+1)+'</span><span>'+esc(o[0])+'</span></button>';
    if(answered){
      var tr = (o[1]===1);
      h+='<div class="note"><b class="'+(tr?'t':'f')+'">'+(tr?'○ 正しい記述':'× 誤った記述')+'</b>'+
         (!tr && o[2]>=0 ? '<span class="tagk">'+esc(TYPES[o[2]].n)+'</span>' : '')+
         '<br>'+esc(o[3])+'</div>';
    }
  });
  if(answered){
    h+='<button class="btn" id="nx">'+(s.i===s.ids.length-1?'結果を見る':'次の問題へ')+'</button>';
  }
  app.innerHTML=h;
  document.getElementById("hm").onclick=function(){ save(); viewHome(); };
  if(!answered){
    var b=app.querySelectorAll(".opt");
    for(var k=0;k<b.length;k++){
      b[k].onclick=function(){
        var oi=parseInt(this.getAttribute("data-o"),10);
        s.ans[id]=oi;
        var r=evalQ(q,oi);
        D.n++; if(r.correct) D.right++; else D.falls[r.k]++;
        var h0=D.qs[id]||{n:0,w:0}; h0.n++; h0.w=r.correct?0:1; D.qs[id]=h0;
        save(); viewQuiz();
        var v=app.querySelector(".verdict"); if(v&&v.scrollIntoView) v.scrollIntoView({block:"start",behavior:"smooth"});
      };
    }
  }else{
    document.getElementById("nx").onclick=function(){ s.i++; save(); window.scrollTo(0,0); viewQuiz(); };
  }
}

function viewResult(){
  var s=D.sess, right=0, falls=[0,0,0,0,0,0,0,0];
  s.ids.forEach(function(id){
    var r=evalQ(Q[id], s.ans[id]);
    if(r.correct) right++; else falls[r.k]++;
  });
  var order=[0,1,2,3,4,5,6,7].filter(function(k){return falls[k]>0;}).sort(function(a,b){return falls[b]-falls[a];});
  var h='<h1>結果</h1><div class="card"><div class="score"><b>'+right+'</b><span> / '+s.ids.length+'問</span></div></div>';
  if(order.length){
    h+='<h2>引っかかった型</h2><div class="card" style="margin-top:0">';
    order.forEach(function(k){
      h+='<div class="row"><span>'+esc(TYPES[k].n)+'</span><span>'+falls[k]+'回</span></div><div class="track"><i style="width:'+Math.round(falls[k]/falls[order[0]]*100)+'%"></i></div>';
    });
    h+='</div>';
    var t=TYPES[order[0]];
    h+='<div class="card" style="background:#e9f1f8; border-color:#c5d8e8"><p style="margin-top:0"><b>いちばん注意する型：'+esc(t.n)+'</b></p><p style="margin-bottom:0">'+esc(t.tip)+'</p></div>';
  }else{
    h+='<div class="notice good">全問正解です。ひっかけに引っかかりませんでした。</div>';
  }
  h+='<button class="btn" id="cp">結果をコピーして進行役に送る</button>'+
     '<div class="notice good hidden" id="cpok">コピーしました。チャットやメールに貼り付けて送ってください。</div>'+
     '<button class="btn ghost" id="wk"'+(weakTypes().length?'':' disabled')+'>引っかかりやすい型から10問</button>'+
     '<button class="btn ghost" id="hm">ホームへ</button>';
  app.innerHTML=h; window.scrollTo(0,0);
  document.getElementById("cp").onclick=function(){
    var L=["【覚えず受かるケアマネ試験｜ひっかけ対策】","名前："+(userName()||"（未記入）"),"結果："+right+" / "+s.ids.length+"問"];
    L.push("引っかかった型："+(order.length?order.map(function(k){return TYPES[k].n+" "+falls[k]+"回";}).join("、"):"なし"));
    copyText(L.join("\n"), function(){ document.getElementById("cpok").className="notice good"; });
  };
  document.getElementById("wk").onclick=function(){ D.sess=null; save(); startSession("weak"); };
  document.getElementById("hm").onclick=function(){ D.sess=null; save(); viewHome(); };
}

/* ---------- 起動 ---------- */
D = ld(KEY);
if(!D || !D.falls || D.falls.length!==8){ D=initD(); save(); }
viewHome();

})();
</script>
</body>
</html>
